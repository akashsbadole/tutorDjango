{% load ui_tags %}
<!-- Enhanced Notification Dropdown Component -->
<div class="dropdown notification-dropdown-container {{ container_class|default:'' }}" 
     x-data="notificationDropdown('{{ notification_id|default:'notifications' }}')"
     @click.outside="close()">
    
    <!-- Notification Trigger Button -->
    <button class="btn btn-link nav-link notification-trigger py-2 px-1 px-lg-2 position-relative" 
            type="button" 
            @click="toggle()"
            :aria-expanded="open"
            aria-haspopup="true"
            aria-label="Notifications">
        <i class="bi bi-bell notification-icon" 
           :class="{ 'notification-pulse': hasUnreadNotifications }"></i>
        
        <!-- Notification Badge -->
        <span class="notification-badge" 
              x-show="unreadCount > 0"
              x-text="unreadCount > 99 ? '99+' : unreadCount"
              :class="{
                  'badge-primary': unreadCount <= 5,
                  'badge-warning': unreadCount > 5 && unreadCount <= 10,
                  'badge-danger': unreadCount > 10
              }">0</span>
    </button>
    
    <!-- Notification Dropdown -->
    <div class="dropdown-menu dropdown-menu-end notification-dropdown shadow-lg border-0" 
         x-show="open" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 transform scale-95"
         x-transition:enter-end="opacity-100 transform scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 transform scale-100"
         x-transition:leave-end="opacity-0 transform scale-95"
         style="display: none; min-width: 350px; max-height: 480px; overflow: hidden;">
        
        <!-- Dropdown Header -->
        <div class="notification-header dropdown-header d-flex justify-content-between align-items-center py-3">
            <h6 class="mb-0 fw-semibold">Notifications</h6>
            <div class="notification-header-actions">
                {% if mark_all_read_url %}
                <button class="btn btn-sm btn-outline-secondary" 
                        @click="markAllRead()"
                        x-show="unreadCount > 0"
                        :disabled="loading">
                    <i class="bi bi-check-all me-1"></i>
                    Mark all read
                </button>
                {% endif %}
                
                <button class="btn btn-sm btn-outline-secondary" 
                        @click="openSettings()"
                        title="Notification settings">
                    <i class="bi bi-gear"></i>
                </button>
            </div>
        </div>
        
        <!-- Notification Filters -->
        {% if show_filters %}
        <div class="notification-filters px-3 py-2 border-bottom">
            <div class="btn-group btn-group-sm w-100" role="group">
                <button type="button" 
                        class="btn btn-outline-secondary"
                        @click="filter = 'all'"
                        :class="{ 'active': filter === 'all' }">
                    All
                </button>
                <button type="button" 
                        class="btn btn-outline-secondary"
                        @click="filter = 'unread'"
                        :class="{ 'active': filter === 'unread' }">
                    Unread
                    <span class="badge bg-primary ms-1" x-show="unreadCount > 0" x-text="unreadCount"></span>
                </button>
                <button type="button" 
                        class="btn btn-outline-secondary"
                        @click="filter = 'mentions'"
                        :class="{ 'active': filter === 'mentions' }">
                    Mentions
                </button>
            </div>
        </div>
        {% endif %}
        
        <!-- Notification List -->
        <div class="notification-list overflow-auto" 
             style="max-height: 300px;"
             @scroll="handleScroll($event)">
            
            <!-- Loading State -->
            <div x-show="loading && notifications.length === 0" class="text-center py-4">
                <div class="spinner-border spinner-border-sm" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="text-muted mt-2 mb-0">Loading notifications...</p>
            </div>
            
            <!-- Empty State -->
            <div x-show="!loading && notifications.length === 0" class="text-center py-4">
                <i class="bi bi-bell-slash fs-1 text-muted d-block mb-3"></i>
                <p class="text-muted mb-0">No notifications</p>
            </div>
            
            <!-- Notification Items -->
            <template x-for="notification in filteredNotifications" :key="notification.id">
                <div class="notification-item dropdown-item d-flex align-items-start p-3"
                     :class="{
                         'unread': !notification.read,
                         'read': notification.read,
                         'notification-mention': notification.type === 'mention',
                         'notification-message': notification.type === 'message',
                         'notification-system': notification.type === 'system'
                     }"
                     :id="`notification-${notification.id}`"
                     @click="handleNotificationClick(notification)">
                    
                    <!-- Notification Icon -->
                    <div class="notification-icon-wrapper me-3">
                        <div class="notification-icon-container"
                             :class="`notification-${notification.type}`">
                            <i class="bi" :class="getNotificationIcon(notification.type)"></i>
                        </div>
                        <div class="notification-indicator" 
                             x-show="!notification.read"></div>
                    </div>
                    
                    <!-- Notification Content -->
                    <div class="notification-content flex-grow-1">
                        <div class="notification-title fw-semibold" x-text="notification.title"></div>
                        <div class="notification-message text-muted small" x-text="notification.message"></div>
                        
                        <div class="notification-meta d-flex align-items-center mt-1">
                            <span class="notification-time text-muted small me-2" x-text="formatTime(notification.created_at)"></span>
                            {% if show_source %}
                            <span class="notification-source badge bg-light text-dark small" x-text="notification.source"></span>
                            {% endif %}
                        </div>
                    </div>
                    
                    <!-- Notification Actions -->
                    <div class="notification-actions ms-2">
                        <button type="button" 
                                class="btn btn-sm btn-link text-muted p-1"
                                @click.stop="markAsRead(notification.id)"
                                x-show="!notification.read"
                                title="Mark as read">
                            <i class="bi bi-check"></i>
                        </button>
                        <button type="button" 
                                class="btn btn-sm btn-link text-muted p-1"
                                @click.stop="deleteNotification(notification.id)"
                                title="Delete notification">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
            </template>
            
            <!-- Load More -->
            <div x-show="hasMore && !loading" class="text-center py-2">
                <button class="btn btn-sm btn-outline-primary" @click="loadMore()">
                    Load more
                </button>
            </div>
        </div>
        
        <!-- Dropdown Footer -->
        <div class="notification-footer dropdown-footer px-3 py-2 border-top">
            <div class="d-flex justify-content-between align-items-center">
                <a href="{{ notifications_list_url|default:'#' }}" class="btn btn-sm btn-outline-secondary">
                    View all notifications
                    <i class="bi bi-arrow-right ms-1"></i>
                </a>
                
                <button class="btn btn-sm btn-outline-secondary" 
                        @click="markAllRead()"
                        x-show="unreadCount > 0">
                    Mark all as read
                </button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('notificationDropdown', (notificationId) => ({
        open: false,
        loading: false,
        notifications: [],
        unreadCount: 0,
        filter: 'all',
        page: 1,
        hasMore: false,
        
        init() {
            // Load initial data
            this.loadNotifications();
            this.loadUnreadCount();
            
            // Set up WebSocket for real-time updates if available
            this.setupWebSocket();
            
            // Set up periodic refresh
            setInterval(() => {
                if (!this.open) {
                    this.loadUnreadCount();
                }
            }, 30000); // Refresh every 30 seconds
        },
        
        get filteredNotifications() {
            if (this.filter === 'all') {
                return this.notifications;
            } else if (this.filter === 'unread') {
                return this.notifications.filter(n => !n.read);
            } else if (this.filter === 'mentions') {
                return this.notifications.filter(n => n.type === 'mention');
            }
            return this.notifications;
        },
        
        get hasUnreadNotifications() {
            return this.unreadCount > 0;
        },
        
        toggle() {
            this.open = !this.open;
            
            if (this.open) {
                this.loadNotifications();
            }
        },
        
        close() {
            this.open = false;
        },
        
        async loadNotifications(append = false) {
            if (this.loading) return;
            
            this.loading = true;
            
            try {
                const url = new URL('{{ notifications_url|default:'#' }}', window.location.origin);
                url.searchParams.set('page', this.page);
                
                const response = await fetch(url.toString());
                const data = await response.json();
                
                if (append) {
                    this.notifications = [...this.notifications, ...data.results];
                } else {
                    this.notifications = data.results || [];
                }
                
                this.hasMore = data.has_more || false;
                this.page += 1;
                
            } catch (error) {
                console.error('Error loading notifications:', error);
                this.$dispatch('notification-error', {
                    error: error.message
                });
            } finally {
                this.loading = false;
            }
        },
        
        async loadUnreadCount() {
            try {
                const response = await fetch('{{ unread_count_url|default:'#' }}');
                const data = await response.json();
                this.unreadCount = data.count || 0;
                
                // Update badge
                this.$dispatch('unread-count-updated', {
                    count: this.unreadCount
                });
                
            } catch (error) {
                console.error('Error loading unread count:', error);
            }
        },
        
        async loadMore() {
            await this.loadNotifications(true);
        },
        
        async markAllRead() {
            if (this.loading || this.unreadCount === 0) return;
            
            try {
                const response = await fetch('{{ mark_all_read_url|default:'#' }}', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': this.getCSRFToken(),
                        'Content-Type': 'application/json',
                    },
                });
                
                if (response.ok) {
                    // Mark all as read in UI
                    this.notifications = this.notifications.map(n => ({ ...n, read: true }));
                    this.unreadCount = 0;
                    
                    this.$dispatch('notifications-marked-read', {
                        all: true
                    });
                    
                    this.showToast('All notifications marked as read', 'success');
                } else {
                    throw new Error('Failed to mark all as read');
                }
            } catch (error) {
                console.error('Error marking all as read:', error);
                this.showToast('Failed to mark notifications as read', 'error');
            }
        },
        
        async markAsRead(notificationId) {
            try {
                const response = await fetch(`/notifications/${notificationId}/mark-read/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': this.getCSRFToken(),
                        'Content-Type': 'application/json',
                    },
                });
                
                if (response.ok) {
                    // Update notification in UI
                    const notification = this.notifications.find(n => n.id === notificationId);
                    if (notification) {
                        notification.read = true;
                        this.unreadCount = Math.max(0, this.unreadCount - 1);
                    }
                    
                    this.$dispatch('notification-marked-read', {
                        notificationId: notificationId
                    });
                }
            } catch (error) {
                console.error('Error marking notification as read:', error);
            }
        },
        
        async deleteNotification(notificationId) {
            if (!confirm('Are you sure you want to delete this notification?')) return;
            
            try {
                const response = await fetch(`/notifications/${notificationId}/delete/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': this.getCSRFToken(),
                        'Content-Type': 'application/json',
                    },
                });
                
                if (response.ok) {
                    // Remove notification from UI
                    const index = this.notifications.findIndex(n => n.id === notificationId);
                    if (index !== -1) {
                        const wasUnread = !this.notifications[index].read;
                        this.notifications.splice(index, 1);
                        
                        if (wasUnread) {
                            this.unreadCount = Math.max(0, this.unreadCount - 1);
                        }
                    }
                    
                    this.$dispatch('notification-deleted', {
                        notificationId: notificationId
                    });
                    
                    this.showToast('Notification deleted', 'success');
                }
            } catch (error) {
                console.error('Error deleting notification:', error);
                this.showToast('Failed to delete notification', 'error');
            }
        },
        
        handleNotificationClick(notification) {
            // Mark as read if unread
            if (!notification.read) {
                this.markAsRead(notification.id);
            }
            
            // Navigate to notification URL if provided
            if (notification.url) {
                window.location.href = notification.url;
            }
            
            // Emit click event
            this.$dispatch('notification-clicked', {
                notification: notification
            });
        },
        
        handleScroll(event) {
            const element = event.target;
            if (element.scrollTop + element.clientHeight >= element.scrollHeight - 100) {
                if (this.hasMore && !this.loading) {
                    this.loadMore();
                }
            }
        },
        
        openSettings() {
            // Open notification settings modal or navigate to settings page
            this.$dispatch('notification-settings-requested');
        },
        
        getNotificationIcon(type) {
            const icons = {
                'message': 'bi-envelope',
                'mention': 'bi-at',
                'system': 'bi-gear',
                'booking': 'bi-calendar-check',
                'payment': 'bi-credit-card',
                'review': 'bi-star',
                'alert': 'bi-exclamation-triangle'
            };
            return icons[type] || 'bi-bell';
        },
        
        formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            // Less than a minute
            if (diff < 60000) {
                return 'Just now';
            }
            
            // Less than an hour
            if (diff < 3600000) {
                const minutes = Math.floor(diff / 60000);
                return `${minutes} minute${minutes > 1 ? 's' : ''} ago`;
            }
            
            // Less than a day
            if (diff < 86400000) {
                const hours = Math.floor(diff / 3600000);
                return `${hours} hour${hours > 1 ? 's' : ''} ago`;
            }
            
            // Less than a week
            if (diff < 604800000) {
                const days = Math.floor(diff / 86400000);
                return `${days} day${days > 1 ? 's' : ''} ago`;
            }
            
            // Otherwise, return formatted date
            return date.toLocaleDateString();
        },
        
        getCSRFToken() {
            return document.querySelector('[name=csrfmiddlewaretoken]')?.value || 
                   document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1];
        },
        
        showToast(message, type = 'info') {
            // Use global toast system if available
            if (window.AlertManager) {
                window.AlertManager.show({
                    message: message,
                    level: type,
                    auto_dismiss: 3000
                });
            }
        },
        
        setupWebSocket() {
            // Set up WebSocket for real-time notifications if available
            {% if websocket_url %}
            try {
                const ws = new WebSocket('{{ websocket_url }}');
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'notification') {
                        this.notifications.unshift(data.notification);
                        this.unreadCount += 1;
                        
                        // Show toast for new notification
                        this.showToast(data.notification.title, 'info');
                    }
                };
                
                ws.onclose = () => {
                    // Reconnect after delay
                    setTimeout(() => this.setupWebSocket(), 5000);
                };
            } catch (error) {
                console.error('WebSocket connection failed:', error);
            }
            {% endif %}
        }
    }));
});
</script>

<style>
/* Notification Dropdown Container */
.notification-dropdown-container {
    position: relative;
}

/* Notification Trigger */
.notification-trigger {
    position: relative;
    color: var(--color-text-primary);
    transition: var(--transition-fast);
}

.notification-trigger:hover {
    color: var(--color-primary);
}

.notification-icon {
    font-size: 1.25rem;
    transition: var(--transition-fast);
}

.notification-pulse {
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

/* Notification Badge */
.notification-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    min-width: 18px;
    height: 18px;
    border-radius: 9px;
    font-size: 0.7rem;
    font-weight: 600;
    line-height: 1;
    text-align: center;
    padding: 0 4px;
}

.badge-primary {
    background-color: var(--color-primary);
    color: white;
}

.badge-warning {
    background-color: var(--color-warning);
    color: white;
}

.badge-danger {
    background-color: var(--color-danger);
    color: white;
}

/* Notification Dropdown */
.notification-dropdown {
    border-radius: var(--border-radius-lg);
    box-shadow: var(--shadow-xl);
    backdrop-filter: blur(10px);
    overflow: hidden;
}

/* Notification Header */
.notification-header {
    background-color: var(--color-bg-secondary);
    border-bottom: 1px solid var(--color-border-light);
}

.notification-header-actions {
    display: flex;
    gap: var(--space-1);
}

/* Notification Filters */
.notification-filters {
    background-color: var(--color-bg-secondary);
    border-bottom: 1px solid var(--color-border-light);
}

/* Notification List */
.notification-list {
    background-color: var(--color-bg-primary);
}

/* Notification Item */
.notification-item {
    border-bottom: 1px solid var(--color-border-light);
    transition: var(--transition-fast);
    cursor: pointer;
}

.notification-item:last-child {
    border-bottom: none;
}

.notification-item:hover {
    background-color: var(--color-bg-secondary);
}

.notification-item.unread {
    background-color: rgba(var(--color-primary), 0.05);
    border-left: 3px solid var(--color-primary);
}

.notification-item.read {
    opacity: 0.8;
}

/* Notification Icon */
.notification-icon-wrapper {
    position: relative;
    flex-shrink: 0;
}

.notification-icon-container {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
}

.notification-message .notification-icon-container {
    background-color: rgba(var(--color-info), 0.1);
    color: var(--color-info);
}

.notification-mention .notification-icon-container {
    background-color: rgba(var(--color-warning), 0.1);
    color: var(--color-warning);
}

.notification-system .notification-icon-container {
    background-color: rgba(var(--color-secondary), 0.1);
    color: var(--color-secondary);
}

.notification-indicator {
    position: absolute;
    top: 0;
    right: 0;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-color: var(--color-primary);
    border: 2px solid var(--color-bg-primary);
}

/* Notification Content */
.notification-content {
    min-width: 0;
}

.notification-title {
    font-size: var(--font-size-sm);
    margin-bottom: var(--space-1);
    color: var(--color-text-primary);
}

.notification-message {
    font-size: var(--font-size-sm);
    line-height: 1.4;
    color: var(--color-text-secondary);
}

.notification-meta {
    gap: var(--space-2);
}

.notification-time {
    font-size: var(--font-size-xs);
}

.notification-source {
    font-size: var(--font-size-xs);
}

/* Notification Actions */
.notification-actions {
    opacity: 0;
    transition: var(--transition-fast);
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
}

.notification-item:hover .notification-actions {
    opacity: 1;
}

/* Notification Footer */
.notification-footer {
    background-color: var(--color-bg-secondary);
    border-top: 1px solid var(--color-border-light);
}

/* Dark Mode Adjustments */
[data-theme="dark"] .notification-dropdown {
    background-color: var(--color-bg-secondary);
    border-color: var(--color-border-medium);
}

[data-theme="dark"] .notification-header,
[data-theme="dark"] .notification-filters,
[data-theme="dark"] .notification-footer {
    background-color: var(--color-bg-tertiary);
    border-color: var(--color-border-medium);
}

[data-theme="dark"] .notification-item.unread {
    background-color: rgba(var(--color-primary), 0.1);
}

[data-theme="dark"] .notification-indicator {
    border-color: var(--color-bg-secondary);
}

/* Responsive Design */
@media (max-width: 768px) {
    .notification-dropdown {
        min-width: 300px;
        max-width: 90vw;
    }
    
    .notification-item {
        padding: var(--space-2);
    }
    
    .notification-icon-container {
        width: 32px;
        height: 32px;
        font-size: 0.875rem;
    }
}

/* Accessibility */
.notification-item:focus-within {
    outline: 2px solid var(--color-primary);
    outline-offset: -2px;
}

/* High Contrast Mode */
@media (prefers-contrast: high) {
    .notification-item {
        border-bottom-width: 2px;
    }
    
    .notification-indicator {
        border-width: 2px;
    }
}

/* Reduced Motion */
@media (prefers-reduced-motion: reduce) {
    .notification-pulse {
        animation: none;
    }
    
    .notification-item,
    .notification-actions {
        transition: none;
    }
}
</style>
