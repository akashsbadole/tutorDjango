name: Coverage Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django pytest-cov pytest-mock
        pip install coverage[toml]

    - name: Run tests with coverage
      run: |
        coverage run --source=tutor_platform -m pytest tests/ --settings=tutor_platform.test_settings --junitxml=pytest-report.xml
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db

    - name: Generate coverage report
      run: |
        coverage report --format=html --show-missing
        coverage xml --fail-under=80

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

    - name: Upload coverage HTML
      uses: actions/upload-artifact@v3
      with:
        name: coverage-html
        path: htmlcov/

    - name: Upload coverage XML
      uses: actions/upload-artifact@v3
      with:
        name: coverage-xml
        path: coverage.xml

    - name: Upload test results
      uses: actions/upload-artifact@v3
      with:
        name: pytest-results
        path: pytest-report.xml