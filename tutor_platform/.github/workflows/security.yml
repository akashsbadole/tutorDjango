name: Security Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security tests weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit safety semgrep
        pip install pytest pytest-django pytest-mock

    - name: Run Bandit security linter
      run: |
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . -f txt

    - name: Run Safety check for known vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        safety check

    - name: Run Semgrep security scan
      run: |
        semgrep --config=auto --json --output=semgrep-report.json . || true

    - name: Run Django security tests
      run: |
        python manage.py test tests.security --settings=tutor_platform.test_settings --verbosity=2

    - name: Run SQL injection tests
      run: |
        python manage.py test tests.security.test_security::SQLInjectionTest --settings=tutor_platform.test_settings

    - name: Run XSS protection tests
      run: |
        python manage.py test tests.security.test_security::XSSProtectionTest --settings=tutor_platform.test_settings

    - name: Run CSRF protection tests
      run: |
        python manage.py test tests.security.test_security::CSRFProtectionTest --settings=tutor_platform.test_settings

    - name: Run authentication bypass tests
      run: |
        python manage.py test tests.security.test_security::AuthenticationBypassTest --settings=tutor_platform.test_settings

    - name: Run authorization escalation tests
      run: |
        python manage.py test tests.security.test_security::AuthorizationEscalationTest --settings=tutor_platform.test_settings

    - name: Run data leakage tests
      run: |
        python manage.py test tests.security.test_security::DataLeakageTest --settings=tutor_platform.test_settings

    - name: Upload Bandit report
      uses: actions/upload-artifact@v3
      with:
        name: bandit-report
        path: bandit-report.json

    - name: Upload Safety report
      uses: actions/upload-artifact@v3
      with:
        name: safety-report
        path: safety-report.json

    - name: Upload Semgrep report
      uses: actions/upload-artifact@v3
      with:
        name: semgrep-report
        path: semgrep-report.json

    - name: Comment on PR with security findings
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          
          // Parse security reports
          let banditIssues = 0;
          let safetyIssues = 0;
          let semgrepIssues = 0;
          
          try {
            const banditReport = JSON.parse(fs.readFileSync('bandit-report.json', 'utf8'));
            banditIssues = banditReport.results ? banditReport.results.length : 0;
          } catch (e) {
            console.log('No Bandit report found');
          }
          
          try {
            const safetyReport = JSON.parse(fs.readFileSync('safety-report.json', 'utf8'));
            safetyIssues = safetyReport.vulnerabilities ? safetyReport.vulnerabilities.length : 0;
          } catch (e) {
            console.log('No Safety report found');
          }
          
          try {
            const semgrepReport = JSON.parse(fs.readFileSync('semgrep-report.json', 'utf8'));
            semgrepIssues = semgrepReport.results ? semgrepReport.results.length : 0;
          } catch (e) {
            console.log('No Semgrep report found');
          }
          
          // Create security comment
          const totalIssues = banditIssues + safetyIssues + semgrepIssues;
          const status = totalIssues === 0 ? '✅ PASSED' : '⚠️ ISSUES FOUND';
          
          const comment = `
          ## Security Scan Results
          
          **Status: ${status}**
          
          | Tool | Issues Found |
          |------|--------------|
          | Bandit | ${banditIssues} |
          | Safety | ${safetyIssues} |
          | Semgrep | ${semgrepIssues} |
          | **Total** | **${totalIssues}** |
          
          ${totalIssues > 0 ? 'Please review the security reports and address any issues before merging.' : 'No security issues detected.'}
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  dependency-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety pip-audit

    - name: Check for known vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        pip-audit --format=json --output=audit-report.json || true

    - name: Upload Safety report
      uses: actions/upload-artifact@v3
      with:
        name: dependency-safety
        path: safety-report.json

    - name: Upload Audit report
      uses: actions/upload-artifact@v3
      with:
        name: dependency-audit
        path: audit-report.json

  codeql-analysis:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v2

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2